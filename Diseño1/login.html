<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">

    <link rel="stylesheet" href="styles.css">
    <title>Hello, world!</title>
  </head>
  <body >
    <div class="container my-4 d-flex flex-row">
        
            <div class="jumbotron mr-0 my-0 w-75 bg-white border-right border-3 border-warning pb-0">
                <h4 class="title-login pb-3"> 
                    <i class="fa fa-star text-warning" aria-hidden="true"></i> QUEENTESSENCE
                </h4>
                <div class="text-muted ">
                    <h6 >Welcome back!</h6>
                    <p class="p-login">Enter your email address and password to gain access to andromeda's user panel.</p>
                </div>
                <form class="form-login">
                    <div class="form-group">
                        <label for="exampleInputEmail1">Email address</label>
                        
                        <div class="input-group mb-2">
                            <div class="input-group-prepend">
                            <div class="input-group-text"><i class="fa fa-envelope-o" aria-hidden="true"></i></div>
                            </div>
                            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="example@email.com">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="exampleInputPassword1">Password</label>
                        <div class="input-group mb-2">
                            <div class="input-group-prepend">
                            <div class="input-group-text"><i class="fa fa-lock" aria-hidden="true"></i></div>
                            </div>
                            <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Enter your Password">
                        </div>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="exampleCheck1">
                        <label class="form-check-label" for="exampleCheck1">Remember me</label>
                    </div>
                    <button type="submit" class="btn btn-color btn-block mt-3">Log in</button>
                    
                </form>
                <p class="text-center">Or</p>
                <div class="d-flex justify-content-between">
                    <a href="#" class="btn btn-light border " role="button" aria-disabled="true"><i class="fa fa-google text-danger" aria-hidden="true"></i> With Google</a>
                    <a href="#" class="btn btn-light border" role="button" aria-disabled="true"><i class="fa fa-facebook-official text-primary" aria-hidden="true"></i> With Facebook</a>
                </div>
                <small id="emailHelp" class="form-text text-muted text-center pb-3">@2019 All Rights Reserved Queentessence.io</small>
               
            </div>
            <!-- <small  class="form-text text-muted text-center">Don´t have an account yet? <a href="#"> Contact Us</a></small> -->

                <img src="https://www.prospectfactory.com.mx/wp-content/uploads/2020/08/shutterstock_378716374.png" class=" w-50 border-right border-3 border-warning " alt="Robot with movil" >
            
          
        
      </div>
    
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
  </body>
</html>
